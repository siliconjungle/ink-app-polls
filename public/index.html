<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polls · Ink</title><link rel="stylesheet" href="./styles/ink.css"><link rel="stylesheet" href="./app.css"></head><body>
<div id="app"><header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true"></span><strong>Polls</strong></div><span id="connection" role="status">Connecting…</span><button id="new-poll" class="primary" disabled>＋ New poll</button></header>
<div class="toolbar"><nav aria-label="Poll filters"><button data-filter="all" class="active" aria-pressed="true">All polls</button><button data-filter="open" aria-pressed="false">Open</button><button data-filter="closed" aria-pressed="false">Closed</button><button data-filter="mine" aria-pressed="false">My polls</button></nav><input id="search" type="search" aria-label="Search polls" placeholder="Search polls…"></div>
<div id="notice" class="notice" role="status" hidden></div><main id="feed" aria-label="Polls"><div class="empty">Connecting to your Ink desktop…</div></main></div>
<dialog id="composer"><form id="poll-form"><div class="dialog-header"><h1>Create a poll</h1><button type="button" id="cancel" class="icon-button" aria-label="Close composer">×</button></div><p class="intro">A quick question for everyone on your Ink desktop.</p><label for="question">Question</label><textarea id="question" placeholder="What do you want to ask?" rows="3" required></textarea><div id="question-count" class="counter">0 / 280</div><div class="choice-heading"><label>Choices</label><span>2–4 options</span></div><div id="choices"></div><button type="button" id="add-choice" class="subtle">＋ Add a choice</button><label for="duration">Poll duration</label><select id="duration"><option value="5">5 minutes</option><option value="60">1 hour</option><option value="1440" selected>1 day</option><option value="4320">3 days</option><option value="10080">7 days</option></select><p class="help">One vote per account. Results appear after voting, or when the poll closes.</p><p id="form-error" class="error" role="alert" hidden></p><footer><button type="submit" id="publish" class="primary">Create poll</button></footer></form></dialog>
<dialog id="close-dialog"><form method="dialog"><h2>End this poll?</h2><p>Voting will stop and everyone can see the final results.</p><footer><button value="cancel">Keep open</button><button value="close" class="primary">End poll</button></footer></form></dialog>
<script type="module" src="./app.mjs"></script></body></html>
